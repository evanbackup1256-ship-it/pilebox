name: pilebox
description: A local, Zettelkasten-style markdown knowledge base for Windows.
publish_to: none
version: 3.2.2

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Window sizing and titling for the desktop shell.
  window_manager: ^0.5.2

  # Checks GitHub Releases and downloads updates.
  http: ^1.6.0

  # Vault folder, settings, and downloaded-update locations.
  path_provider: ^2.1.6

  # SHA-256 verification of downloaded update packages before they run.
  crypto: ^3.0.3

  # Vault export/import as a single zip file.
  archive: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
